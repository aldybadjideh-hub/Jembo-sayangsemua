<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Jembo Love Everybody</title>

<style>

/* =========================
   DASAR
========================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
}

body{
    background:
        radial-gradient(
            circle at center,
            #421052,
            #13051c 55%,
            #030106
        );

    font-family:Arial,sans-serif;
}


/* =========================
   HALAMAN AWAL
========================= */

#awal{

    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;

    color:white;

    transition:
        opacity 1s ease;
}

.subjudul{

    font-size:11px;

    letter-spacing:6px;

    opacity:.55;

    margin-bottom:18px;
}

.judulAwal{

    font-size:32px;

    margin-bottom:40px;

    text-shadow:
        0 0 10px #ff4da6,
        0 0 30px #ff1493;

}


/* =========================
   TOMBOL
========================= */

button{

    border:none;

    padding:
        16px 35px;

    border-radius:50px;

    background:
        linear-gradient(
            135deg,
            #ff1493,
            #9b27ff
        );

    color:white;

    font-size:16px;

    letter-spacing:2px;

    box-shadow:
        0 0 15px #ff1493,
        0 0 35px rgba(255,20,147,.4);

}

button:active{
    transform:scale(.9);
}


/* =========================
   HALAMAN PESAN
========================= */

#pesan{

    position:fixed;

    inset:0;

    display:none;

    justify-content:center;
    align-items:center;

    flex-direction:column;

    text-align:center;

}


/* tulisan kecil */

.loveSmall{

    color:#ffb5dc;

    font-size:11px;

    letter-spacing:7px;

    opacity:0;

    animation:
        munculKecil 1s
        forwards;

}


/* tulisan utama */

.loveTitle{

    margin-top:15px;

    font-size:38px;

    font-weight:bold;

    color:white;

    opacity:0;

    transform:
        scale(.3)
        translateY(30px);

    animation:
        munculJudul 1.8s
        cubic-bezier(.17,.67,.3,1.3)
        forwards
        .5s;

    text-shadow:
        0 0 5px #ffb5dc,
        0 0 15px #ff4da6,
        0 0 35px #ff1493;

}


/* garis dekorasi */

.garis{

    width:0;

    height:2px;

    margin-top:20px;

    background:#ff5eac;

    box-shadow:
        0 0 10px #ff1493;

    animation:
        garisMuncul 1.2s
        forwards
        1.2s;

}


/* =========================
   ANIMASI TULISAN
========================= */

@keyframes munculKecil{

    from{
        opacity:0;
        transform:
            translateY(-20px);
    }

    to{
        opacity:.7;
        transform:
            translateY(0);
    }

}


@keyframes munculJudul{

    0%{
        opacity:0;

        transform:
            scale(.3)
            translateY(30px);
    }

    60%{
        opacity:1;

        transform:
            scale(1.08)
            translateY(0);
    }

    100%{
        opacity:1;

        transform:
            scale(1)
            translateY(0);
    }

}


@keyframes garisMuncul{

    from{
        width:0;
    }

    to{
        width:180px;
    }

}


/* =========================
   LOVE TAP
========================= */

.heart{

    position:fixed;

    pointer-events:none;

    font-size:28px;

    z-index:100;

    animation:
        terbang 1.6s
        ease-out
        forwards;

    filter:
        drop-shadow(
            0 0 8px #ff1493
        );

}


@keyframes terbang{

    0%{

        opacity:1;

        transform:
            translate(-50%,-50%)
            scale(.3)
            rotate(0deg);

    }

    35%{

        opacity:1;

        transform:
            translate(
                calc(-50% + var(--x)),
                calc(-50% - 70px)
            )
            scale(1.3)
            rotate(var(--r));

    }

    100%{

        opacity:0;

        transform:
            translate(
                calc(-50% + var(--x2)),
                calc(-50% - 220px)
            )
            scale(.7)
            rotate(var(--r2));

    }

}


/* =========================
   PETUNJUK
========================= */

.tap{

    position:absolute;

    bottom:25px;

    color:white;

    font-size:10px;

    letter-spacing:4px;

    opacity:.35;

}


/* =========================
   HP KECIL
========================= */

@media(max-width:400px){

    .judulAwal{
        font-size:28px;
    }

    .loveTitle{
        font-size:30px;
    }

}

</style>
</head>


<body>


<!-- =========================
     HALAMAN AWAL
========================= -->

<div id="awal">

    <div class="subjudul">
        SOMETHING SPECIAL
    </div>

    <div class="judulAwal">
        ✨ A Little Surprise
    </div>

    <button onclick="mulai()">
        Klik di sini
    </button>

</div>


<!-- =========================
     PESAN
========================= -->

<div id="pesan">

    <div class="loveSmall">
        WITH LOVE
    </div>

    <div class="loveTitle">
        Jembo Love Everybody
    </div>

    <div class="garis"></div>

    <div class="tap">
        TAP TAP THE SCREEN ♡
    </div>

</div>


<script>

/* =========================
   MULAI
========================= */

function mulai(){

    document.getElementById("awal").style.display="none";

    document.getElementById("pesan").style.display="flex";

}


/* =========================
   TAP → LOVE
========================= */

document.addEventListener(
    "pointerdown",
    function(e){

        var pesan =
            document.getElementById("pesan");


        if(
            pesan.style.display !== "flex"
        ){
            return;
        }


        buatLove(
            e.clientX,
            e.clientY
        );

    }
);


/* =========================
   BUAT LOVE
========================= */

function buatLove(x,y){

    var heart =
        document.createElement("div");


    var pilihan=[
        "❤️",
        "💗",
        "💖",
        "💕",
        "💓",
        "💝"
    ];


    heart.className="heart";


    heart.innerHTML=
        pilihan[
            Math.floor(
                Math.random()*
                pilihan.length
            )
        ];


    heart.style.left=x+"px";
    heart.style.top=y+"px";


    heart.style.setProperty(
        "--x",
        (Math.random()*100-50)+"px"
    );


    heart.style.setProperty(
        "--x2",
        (Math.random()*220-110)+"px"
    );


    heart.style.setProperty(
        "--r",
        (Math.random()*60-30)+"deg"
    );


    heart.style.setProperty(
        "--r2",
        (Math.random()*160-80)+"deg"
    );


    heart.style.fontSize=
        (20+Math.random()*25)+"px";


    document.body.appendChild(
        heart
    );


    setTimeout(
        function(){
            heart.remove();
        },
        1700
    );

}

</script>

</body>
</html>
